# ETL 作业运行环境：PostgreSQL（数据仓库） + Airflow（工作流编排）
#
# 为什么用容器：
#   1. 课件第 44 页建议环境是 "PostgreSQL + Python/SQL"，本机没有 PG，容器是最短路径；
#   2. Airflow 官方不支持 Windows 原生安装，且本机 WSL 被安全策略禁用，只能走容器；
#   3. 答辩时 `docker compose up -d` 一条命令重建，环境本身可复现 —— 这本身是评分点。
#
# 镜像来自 docker.m.daocloud.io：
#   本机 ~/.docker/daemon.json 里配的阿里云镜像源已失效（403），
#   而镜像加速源只对 docker.io 生效，所以这里显式写全域名绕过。

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16
    container_name: etl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"          # 用 5433 避开本机可能已有的 5432
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  airflow:
    image: docker.m.daocloud.io/apache/airflow:2.10.5
    container_name: etl-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/etl/dags
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Shanghai
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # 我们的流水线是纯标准库 Python，不需要额外 pip 包；
      # 关掉 Airflow 启动时的 pip 自检，加快启动。
      AIRFLOW__CORE__MIN_SERIALIZED_DAG_UPDATE_INTERVAL: "30"
      PYTHONPATH: /opt/etl
      ETL_PROJECT_ROOT: /opt/etl
      TZ: Asia/Shanghai
    volumes:
      # 整个工程挂进容器：DAG 里用 BashOperator 调 `python -m src.sXX`，
      # 路径与宿主机完全一致，避免"本地能跑、容器里路径不对"。
      - ../:/opt/etl
    ports:
      - "8080:8080"
    command: standalone

volumes:
  pgdata:
